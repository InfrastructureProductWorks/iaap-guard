name: EP-08 GHE-01 portability contract
on:
  pull_request:
    paths: ["schemas/customer-controlled-github.schema.json", "config/customer-controlled-github-ghes.synthetic.json", "docs/EP-08-GHE-01-CUSTOMER-CONTROLLED-GITHUB.md", ".github/workflows/ghe01-portability-contract.yml"]
  push:
    branches: [main]
    paths: ["schemas/customer-controlled-github.schema.json", "config/customer-controlled-github-ghes.synthetic.json", "docs/EP-08-GHE-01-CUSTOMER-CONTROLLED-GITHUB.md", ".github/workflows/ghe01-portability-contract.yml"]
permissions: {contents: read}
jobs:
  validate-ghe01-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-deps jsonschema==4.25.1 attrs==25.3.0 jsonschema-specifications==2025.4.1 referencing==0.36.2 rpds-py==0.27.1 fqdn==1.5.1 idna==3.10 rfc3986-validator==0.1.1
      - name: Validate bounded customer-controlled GitHub contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,idna
          from pathlib import Path
          from urllib.parse import unquote,urlparse
          from jsonschema import Draft202012Validator,FormatChecker

          schema=json.loads(Path('schemas/customer-controlled-github.schema.json').read_text())
          fixture=json.loads(Path('config/customer-controlled-github-ghes.synthetic.json').read_text())
          ghes_web=r'^https://(?!(?:[^@/?#]+\.)?github\.com(?::[0-9]+)?/?$)[^@/?#]+/?$'
          ghes_api=r'^https://(?!(?:[^@/?#]+\.)?github\.com(?::[0-9]+)?/api/v3/?$)[^@/?#]+/api/v3/?$'
          expected_schema={
            '$schema':'https://json-schema.org/draft/2020-12/schema',
            '$id':'https://infrastructureproductworks.github.io/iaap-guard/schemas/customer-controlled-github.schema.json',
            'title':'IaaP Guard customer-controlled GitHub portability contract',
            'type':'object','additionalProperties':False,
            'required':['schemaVersion','platform','webBaseUrl','apiBaseUrl','appOwnership','installationOwnership','repositorySelection','requiredPermissions','supportClaim','authorizedTargetObserved','networkProbePerformed','credentialsEmbedded','authority'],
            'properties':{
              'schemaVersion':{'const':'iaap-guard-customer-github/v0'},
              'platform':{'enum':['github.com','ghes']},
              'webBaseUrl':{'type':'string','format':'uri','pattern':r'^https://[^@/?#]+/?$'},
              'apiBaseUrl':{'type':'string','format':'uri','pattern':r'^https://[^@/?#]+(?:/api/v3)?/?$'},
              'appOwnership':{'enum':['vendor-hosted','customer-controlled']},
              'installationOwnership':{'const':'customer-controlled'},
              'repositorySelection':{'const':'explicit'},
              'requiredPermissions':{'type':'object','additionalProperties':False,'required':['metadata','contents','pull_requests','checks'],'properties':{'metadata':{'const':'read'},'contents':{'const':'read'},'pull_requests':{'const':'read'},'checks':{'const':'write'}}},
              'supportClaim':{'const':False},'authorizedTargetObserved':{'const':False},'networkProbePerformed':{'const':False},'credentialsEmbedded':{'const':False},
              'authority':{'type':'object','additionalProperties':False,'required':['repositoryWriteAuthorityAdded','infrastructureAuthorityAdded','authorizationAuthorityAdded','mergeAuthorityAdded','deploymentAuthorityAdded'],'properties':{'repositoryWriteAuthorityAdded':{'const':False},'infrastructureAuthorityAdded':{'const':False},'authorizationAuthorityAdded':{'const':False},'mergeAuthorityAdded':{'const':False},'deploymentAuthorityAdded':{'const':False}}}
            },
            'allOf':[
              {'if':{'properties':{'platform':{'const':'github.com'}}},'then':{'properties':{'webBaseUrl':{'const':'https://github.com'},'apiBaseUrl':{'const':'https://api.github.com'}}}},
              {'if':{'properties':{'platform':{'const':'ghes'}}},'then':{'properties':{'appOwnership':{'const':'customer-controlled'},'webBaseUrl':{'pattern':ghes_web},'apiBaseUrl':{'pattern':ghes_api}}}}
            ]
          }
          if schema!=expected_schema: raise SystemExit('published schema differs from canonical bounded contract')
          Draft202012Validator.check_schema(schema)
          validator=Draft202012Validator(schema,format_checker=FormatChecker())
          def se(r): return sorted(e.message for e in validator.iter_errors(r))
          def false_bool(v): return type(v) is bool and v is False
          expected_permissions={'metadata':'read','contents':'read','pull_requests':'read','checks':'write'}
          authority_keys={'repositoryWriteAuthorityAdded','infrastructureAuthorityAdded','authorizationAuthorityAdded','mergeAuthorityAdded','deploymentAuthorityAdded'}
          def nh(v):
            p=urlparse(v) if isinstance(v,str) else None
            if not p or not p.hostname:return None
            decoded=unquote(p.hostname).casefold()
            if decoded.endswith('..'):return None
            if decoded.endswith('.'):decoded=decoded[:-1]
            if not decoded:return None
            try:mapped=idna.uts46_remap(decoded,std3_rules=True,transitional=False).casefold()
            except idna.IDNAError:return None
            if not mapped or mapped.endswith('.'):return None
            try:return idna.encode(mapped,uts46=False,std3_rules=True).decode().casefold()
            except idna.IDNAError:return None
          def hosted(v):
            h=nh(v);return bool(h and (h=='github.com' or h.endswith('.github.com')))
          def sem(r):
            o=[]
            exact={'schemaVersion':'iaap-guard-customer-github/v0','platform':'ghes','appOwnership':'customer-controlled','installationOwnership':'customer-controlled','repositorySelection':'explicit'}
            for k,v in exact.items():
              if type(r.get(k)) is not type(v) or r.get(k)!=v:o.append(k)
            for k in ('supportClaim','authorizedTargetObserved','networkProbePerformed','credentialsEmbedded'):
              if not false_bool(r.get(k)):o.append(k)
            if r.get('requiredPermissions')!=expected_permissions:o.append('requiredPermissions')
            a=r.get('authority')
            if not isinstance(a,dict) or set(a)!=authority_keys or any(not false_bool(a.get(k)) for k in authority_keys):o.append('authority')
            for k in ('webBaseUrl','apiBaseUrl'):
              v=r.get(k);p=urlparse(v) if isinstance(v,str) else None;h=nh(v)
              if not p or p.scheme!='https' or not p.netloc or not p.hostname:o.append(k)
              if p and (p.username is not None or p.password is not None or p.params or p.query or p.fragment):o.append(k+'-components')
              if h is None:o.append(k+'-hostname')
              if hosted(v):o.append(k+'-hosted')
              if p:
                path=p.path or ''
                if k=='webBaseUrl' and path not in ('','/'):o.append(k+'-path')
                if k=='apiBaseUrl' and path not in ('/api/v3','/api/v3/'):o.append(k+'-path')
            return sorted(set(o))
          if se(fixture) or sem(fixture):raise SystemExit('baseline fixture invalid')
          mutations=[('supportClaim',True),('supportClaim',0),('authorizedTargetObserved',True),('networkProbePerformed',True),('credentialsEmbedded',True),('appOwnership','vendor-hosted'),('installationOwnership','vendor-controlled'),('repositorySelection','all')]
          for k,v in mutations:
            m=copy.deepcopy(fixture);m[k]=v
            if not se(m) or not sem(m):raise SystemExit('boundary mutation accepted '+k)
          hosted_web=['https://github.com','https://www.github.com','https://foo.bar.github.com']
          hosted_api=['https://github.com/api/v3','https://api.github.com/api/v3','https://foo.github.com/api/v3']
          for v in hosted_web:
            m=copy.deepcopy(fixture);m['webBaseUrl']=v
            if not se(m) or not sem(m):raise SystemExit('hosted web coordinate accepted '+v)
          for v in hosted_api:
            m=copy.deepcopy(fixture);m['apiBaseUrl']=v
            if not se(m) or not sem(m):raise SystemExit('hosted api coordinate accepted '+v)
          component_cases=[('webBaseUrl','https://marker@github.enterprise.example'),('apiBaseUrl','https://marker@github.enterprise.example/api/v3'),('webBaseUrl','https://github.enterprise.example/?marker=value'),('apiBaseUrl','https://github.enterprise.example/api/v3?marker=value'),('webBaseUrl','https://github.enterprise.example/#marker'),('apiBaseUrl','https://github.enterprise.example/api/v3#marker'),('webBaseUrl','https://github.enterprise.example/;marker=value'),('apiBaseUrl','https://github.enterprise.example/api/v3;marker=value')]
          for k,v in component_cases:
            m=copy.deepcopy(fixture);m[k]=v
            if not se(m) or not sem(m):raise SystemExit('disallowed URL component accepted '+k)
          for k in authority_keys:
            m=copy.deepcopy(fixture);m['authority'][k]=True
            if not se(m) or not sem(m):raise SystemExit('authority mutation accepted '+k)
          m=copy.deepcopy(fixture);m['authority']['unexpectedAuthority']=False
          if not se(m) or not sem(m):raise SystemExit('extra authority key accepted')
          m=copy.deepcopy(fixture);m['requiredPermissions']['administration']='read'
          if not se(m) or not sem(m):raise SystemExit('extra permission key accepted')
          print('GHE-01 customer-controlled GitHub portability contract: PASS')
          PY
