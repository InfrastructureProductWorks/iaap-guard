name: EP-08 GHE-01 portability contract

on:
  pull_request:
    paths:
      - "schemas/customer-controlled-github.schema.json"
      - "config/customer-controlled-github-ghes.synthetic.json"
      - "docs/EP-08-GHE-01-CUSTOMER-CONTROLLED-GITHUB.md"
      - ".github/workflows/ghe01-portability-contract.yml"
  push:
    branches: [main]
    paths:
      - "schemas/customer-controlled-github.schema.json"
      - "config/customer-controlled-github-ghes.synthetic.json"
      - "docs/EP-08-GHE-01-CUSTOMER-CONTROLLED-GITHUB.md"
      - ".github/workflows/ghe01-portability-contract.yml"

permissions:
  contents: read

jobs:
  validate-ghe01-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate bounded customer-controlled GitHub contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          schema = json.loads(Path("schemas/customer-controlled-github.schema.json").read_text())
          fixture = json.loads(Path("config/customer-controlled-github-ghes.synthetic.json").read_text())

          if schema.get("title") != "IaaP Guard customer-controlled GitHub portability contract":
              raise SystemExit("unexpected GHE-01 schema identity")

          def errors(record):
              observed = []
              exact = {
                  "schemaVersion": "iaap-guard-customer-github/v0",
                  "platform": "ghes",
                  "appOwnership": "customer-controlled",
                  "installationOwnership": "customer-controlled",
                  "repositorySelection": "explicit",
                  "supportClaim": False,
                  "authorizedTargetObserved": False,
                  "networkProbePerformed": False,
                  "credentialsEmbedded": False,
              }
              for key, expected in exact.items():
                  if record.get(key) != expected:
                      observed.append(key)

              expected_permissions = {
                  "metadata": "read",
                  "contents": "read",
                  "pull_requests": "read",
                  "checks": "write",
              }
              if record.get("requiredPermissions") != expected_permissions:
                  observed.append("requiredPermissions")

              expected_authority = {
                  "repositoryWriteAuthorityAdded": False,
                  "infrastructureAuthorityAdded": False,
                  "authorizationAuthorityAdded": False,
                  "mergeAuthorityAdded": False,
                  "deploymentAuthorityAdded": False,
              }
              if record.get("authority") != expected_authority:
                  observed.append("authority")

              for key in ("webBaseUrl", "apiBaseUrl"):
                  value = record.get(key)
                  parsed = urlparse(value) if isinstance(value, str) else None
                  if not parsed or parsed.scheme != "https" or not parsed.netloc:
                      observed.append(key)
              if record.get("webBaseUrl") == "https://github.com":
                  observed.append("webBaseUrl-hardcoded-github.com")
              if record.get("apiBaseUrl") == "https://api.github.com":
                  observed.append("apiBaseUrl-hardcoded-github.com")
              return sorted(set(observed))

          baseline_errors = errors(fixture)
          if baseline_errors:
              raise SystemExit(f"GHE-01 synthetic fixture invalid: {baseline_errors}")

          mutations = [
              ("supportClaim", True),
              ("authorizedTargetObserved", True),
              ("networkProbePerformed", True),
              ("credentialsEmbedded", True),
              ("appOwnership", "vendor-hosted"),
              ("installationOwnership", "vendor-controlled"),
              ("webBaseUrl", "https://github.com"),
              ("apiBaseUrl", "https://api.github.com"),
          ]
          for key, value in mutations:
              mutated = copy.deepcopy(fixture)
              mutated[key] = value
              if not errors(mutated):
                  raise SystemExit(f"mutation was not rejected: {key}")

          for key in fixture["authority"]:
              mutated = copy.deepcopy(fixture)
              mutated["authority"][key] = True
              if not errors(mutated):
                  raise SystemExit(f"authority mutation was not rejected: {key}")

          for key, value in {
              "metadata": "write",
              "contents": "write",
              "pull_requests": "write",
              "checks": "admin",
          }.items():
              mutated = copy.deepcopy(fixture)
              mutated["requiredPermissions"][key] = value
              if not errors(mutated):
                  raise SystemExit(f"permission mutation was not rejected: {key}")

          print("GHE-01 customer-controlled GitHub portability contract: PASS")
          PY
